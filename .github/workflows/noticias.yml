name: Jornal Digital Telegram

on:
  schedule:
    - cron: '*/30 * * * *' # Roda automaticamente a cada 30 minutos
  workflow_dispatch: # Permite rodar manualmente clicando em um botão

jobs:
  enviar-noticias:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar RSS para o Telegram
        uses: c-hive/rss-to-telegram-action@v1
        with:
          telegram-bot-token: ${{ secrets.TELEGRAM_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          rss-feeds: |
            https://g1.globo.com/rss/g1/
            https://www.cnnbrasil.com.br/feed/
            https://feeds.folha.uol.com.br/emcimadahora/rss091.xml
            https://rss.uol.com.br/feed/noticias.xml
            https://sbtnews.sbt.com.br/feed
            https://www.correiobraziliense.com.br/rss/ultimas-noticias/rss.xml
            https://veja.abril.com.br/feed
            https://istoe.com.br/feed/
            https://agorarn.com.br/feed/
            https://www.blogdobg.com.br/feed/
            https://robsonpiresxerife.com/feed/
            https://www.jornalfolharegional.com.br/feed/
            https://patu-emfoco.blogspot.com/feeds/posts/default
            https://politicapauferrense.blogspot.com/feeds/posts/default
            https://feeds.feedburner.com/RnPoliticaEmDia2012
            https://tribunadonorte.com.br/feed/
            
